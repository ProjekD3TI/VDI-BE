services:
  app:
    image: vdi-app:latest
    container_name: vdi-app
    restart: unless-stopped
    command: php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
    env_file:
      - .env.stagging
    depends_on:
      - mysql
      - redis

  reverb:
    image: vdi-app:latest
    container_name: vdi-reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    env_file:
      - .env.stagging
    depends_on:
      - mysql
      - redis

  horizon:
    image: vdi-app:latest
    container_name: vdi-horizon
    restart: unless-stopped
    command: php artisan horizon
    env_file:
      - .env.stagging
    depends_on:
      - mysql
      - redis

  monitor:
    image: vdi-app:latest
    container_name: vdi-monitor
    restart: unless-stopped
    command: php artisan app:monitor-proxmox
    env_file:
      - .env.stagging
    depends_on:
      - mysql
      - redis

  # ==========================================
  # TAMBAHKAN SERVICE FRONTEND DI SINI
  # ==========================================
  frontend:
    image: vdi-fe:latest
    container_name: vdi-frontend
    restart: unless-stopped
    ports:
      - "7001:80"
    environment:
      - API_BASE_URL=http://localhost:8000/api
      - REVERB_APP_KEY=ylolbzqhz59o3laixmpw
      - REVERB_HOST=localhost
      - REVERB_PORT=7001
      - REVERB_SCHEME=http
    depends_on:
      - reverb

  mysql:
    image: mysql:8.4
    container_name: vdi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: virtual_desktop_d3ti
    ports:
      - "33076:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: vdi-redis
    restart: unless-stopped
    ports:
      - "63790:6379"
    volumes:
      - redis-data:/data
  mailpit:
    image: axllent/mailpit:latest
    container_name: vdi-mailpit
    restart: unless-stopped

    env_file:
      - ./mailpit.env

    ports:
      - "1025:1025"
      - "8025:8025"

    dns:
      - 8.8.8.8
      - 1.1.1.1
volumes:
  mysql-data:
  redis-data: